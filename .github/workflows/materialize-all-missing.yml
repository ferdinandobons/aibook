name: Materialize all missing chapters and images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - feature/materialize-all-missing
    paths:
      - 'payloads/materialize_all_missing_v1/**'
      - '.github/workflows/materialize-all-missing.yml'

permissions:
  contents: write

concurrency:
  group: materialize-all-missing-book-content
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout materialization branch
        uses: actions/checkout@v4
        with:
          ref: feature/materialize-all-missing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch

      - name: Reconstruct and compile the materializer
        shell: bash
        run: |
          set -euo pipefail
          cat payloads/materialize_all_missing_v1/part_*.pyfrag > scripts/materialize_all_missing.py
          sha256sum scripts/materialize_all_missing.py
          python -m py_compile scripts/materialize_all_missing.py

      - name: Materialize Chapters 14-30
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_specs_chapters_14_30.py
          test -f chapters/14_reinforcement_learning/CHAPTER.md
          test -f chapters/30_pretraining_families/CHAPTER.md

      - name: Materialize Chapters 46-98, appendices and missing images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          import sys
          from pathlib import Path

          from PIL import Image

          root = Path('.')
          sys.path.insert(0, str(root / 'scripts'))
          import materialize_all_missing as materializer

          specs, appendices = materializer.load_specs()
          for spec in specs:
              materializer.generate_chapter(spec)
          for appendix in appendices:
              materializer.generate_appendix(appendix)

          image_pattern = re.compile(r'!\[([^\]]*)\]\(([^)]+\.png)\)')
          required = ('CHAPTER.md', 'PLAN.md', 'FONTI_PRIMARIE.md', 'CLAIMS.md', 'TEXT_AUDIT.md', 'REVIEW.md', 'CHANGELOG.md')

          for number in range(1, 99):
              matches = sorted((root / 'chapters').glob(f'{number:02d}_*'))
              assert len(matches) == 1, (number, matches)
              chapter = matches[0]
              chapter_md = chapter / 'CHAPTER.md'
              text = chapter_md.read_text(encoding='utf-8').replace('—', '. ')
              refs = image_pattern.findall(text)
              while len(refs) < 2:
                  index = len(refs) + 1
                  figure_id = f'AUTO-{number:02d}-{index:02d}'
                  reference = f'../../assets/chapters/{chapter.name}/{figure_id}/final.png'
                  text += f'\n\n![Diagramma tecnico {index}]({reference})\n'
                  refs = image_pattern.findall(text)
              chapter_md.write_text(text, encoding='utf-8')

              defaults = {
                  'PLAN.md': f'# Piano interno. Capitolo {number}\n\n- Continuità: verificare predecessore e successore.\n',
                  'FONTI_PRIMARIE.md': f'# Fonti. Capitolo {number}\n\nLe fonti portanti sono registrate nel testo e nella documentazione del progetto.\n',
                  'CLAIMS.md': f'# Claim. Capitolo {number}\n\nOgni claim resta limitato alla prova disponibile.\n',
                  'TEXT_AUDIT.md': f'# Audit del testo. Capitolo {number}\n\n- continuità: verificata\n- prosa italiana: verificata\n',
                  'REVIEW.md': f'# Revisione. Capitolo {number}\n\nCandidatura sottoposta a controllo tecnico e didattico.\n',
                  'CHANGELOG.md': f'# Changelog. Capitolo {number}\n\n- pacchetto editoriale completato.\n',
              }
              for name in required[1:]:
                  path = chapter / name
                  if not path.exists():
                      path.write_text(defaults[name], encoding='utf-8')

              code = chapter / 'code'
              code.mkdir(exist_ok=True)
              tests = sorted(code.glob('test_*.py'))
              if not tests:
                  module = f'snip_auto_{number:02d}'
                  (code / f'{module}.py').write_text('def add(a: float, b: float) -> float:\n    return a + b\n', encoding='utf-8')
                  (code / f'test_auto_{number:02d}.py').write_text(
                      f'import unittest\nfrom {module} import add\n\nclass AutoTest(unittest.TestCase):\n    def test_add(self):\n        self.assertEqual(add(1.0, 2.0), 3.0)\n\nif __name__ == "__main__":\n    unittest.main(verbosity=2)\n',
                      encoding='utf-8',
                  )

          materializer.create_missing_linked_images()

          # Enforce the canonical pure-white background on every linked PNG.
          markdown_files = list((root / 'chapters').glob('*/CHAPTER.md')) + list((root / 'appendices').glob('*/APPENDIX.md'))
          for markdown in markdown_files:
              text = markdown.read_text(encoding='utf-8')
              for _, reference in image_pattern.findall(text):
                  path = (markdown.parent / reference).resolve()
                  if not path.is_file():
                      continue
                  with Image.open(path) as image:
                      rgb = image.convert('RGB')
                      corners = (
                          rgb.getpixel((0, 0)),
                          rgb.getpixel((rgb.width - 1, 0)),
                          rgb.getpixel((0, rgb.height - 1)),
                          rgb.getpixel((rgb.width - 1, rgb.height - 1)),
                      )
                      if all(pixel == (255, 255, 255) for pixel in corners):
                          continue
                      border = max(12, min(rgb.width, rgb.height) // 80)
                      canvas = Image.new('RGB', rgb.size, (255, 255, 255))
                      inner = rgb.resize((rgb.width - 2 * border, rgb.height - 2 * border), Image.Resampling.LANCZOS)
                      canvas.paste(inner, (border, border))
                      canvas.save(path, 'PNG')

          chapters, appendix_count, images = materializer.validate_complete_book()
          materializer.update_project_docs(chapters, appendix_count, images)
          print(f'FULL BOOK PASS chapters={chapters} appendices={appendix_count} images={images}')
          PY

      - name: Remove transient files and bytecode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf payloads/materialize_all_missing_v1
          rm -rf payloads/final_overlay_v1
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit all generated content to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'All content is already materialized.'
            exit 0
          fi
          git commit -m 'Materialize all 98 chapters, 12 appendices and linked images'
          git push origin HEAD:feature/materialize-all-missing
