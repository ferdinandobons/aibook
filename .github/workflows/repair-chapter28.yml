name: Repair Chapter 28 review Markdown

on:
  push:
    branches:
      - review/chapter-28-pilot
    paths:
      - .github/workflows/repair-chapter28.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: review/chapter-28-pilot
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair Markdown
        run: python scripts/repair_chapter28_markdown.py

      - name: Verify repaired content
        run: |
          ! grep -R '\\operatorname' chapters/28_attention/CHAPTER.md
          ! grep -R 'candidate-v1.png' chapters/28_attention/CHAPTER.md
          grep -F 'ATT-01/candidate-v2.png' chapters/28_attention/CHAPTER.md
          grep -F '\\mathrm{MHA}' chapters/28_attention/CHAPTER.md

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapters/28_attention/CHAPTER.md
          if git diff --cached --quiet; then
            echo 'No Markdown changes to commit.'
          else
            git commit -m 'Repair Chapter 28 math rendering and visual references'
            git push origin HEAD:review/chapter-28-pilot
          fi
