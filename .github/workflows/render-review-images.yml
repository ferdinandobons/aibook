name: Render Chapter 28 review visuals

on:
  push:
    branches:
      - review/chapter-28-pilot
    paths:
      - .github/workflows/render-review-images.yml

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: review/chapter-28-pilot
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Render technical visuals
        run: python scripts/render_attention_visuals.py

      - name: Verify generated PNGs
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          expected = {
              Path('assets/chapters/28_attention/ATT-01/candidate-v2.png'): (1600, 900),
              Path('assets/chapters/28_attention/ATT-02/candidate-v2.png'): (1800, 1000),
          }
          for path, size in expected.items():
              with Image.open(path) as image:
                  image.load()
                  assert image.size == size, (path, image.size, size)
                  assert image.format == 'PNG', (path, image.format)
              assert path.stat().st_size > 20_000, (path, path.stat().st_size)
              print(path, size, path.stat().st_size)
          PY

      - name: Replace broken first candidates
        run: |
          rm -f assets/chapters/28_attention/ATT-01/candidate-v1.png
          rm -f assets/chapters/28_attention/ATT-02/candidate-v1.png

      - name: Commit regenerated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/chapters/28_attention/ATT-01 assets/chapters/28_attention/ATT-02
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
          else
            git commit -m 'Regenerate attention visuals with contained text'
            git push origin HEAD:review/chapter-28-pilot
          fi
