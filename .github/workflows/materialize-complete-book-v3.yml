name: Materialize, validate and finalize complete book

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - feature/full-book-production
    paths:
      - 'payloads/complete_book_v3/READY'
      - '.github/workflows/materialize-complete-book-v3.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: complete-book-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-book-production
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch

      - name: Verify binary payloads
        shell: bash
        run: |
          set -euo pipefail
          test -s payloads/complete_book_v3/gen14.py.xz
          test -s payloads/complete_book_v3/remaining.tar.xz
          sha256sum payloads/complete_book_v3/gen14.py.xz payloads/complete_book_v3/remaining.tar.xz
          xz -t payloads/complete_book_v3/gen14.py.xz
          xz -t payloads/complete_book_v3/remaining.tar.xz

      - name: Materialize Chapters 14-30
        shell: bash
        run: |
          set -euo pipefail
          xz -dc payloads/complete_book_v3/gen14.py.xz > scripts/generate_chapters_14_30.py
          python scripts/generate_chapters_14_30.py
          test -f chapters/14_reinforcement_learning/CHAPTER.md
          test -f chapters/30_pretraining_families/CHAPTER.md

      - name: Materialize Chapters 31-45
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_milestone_31_45.py
          test -f chapters/31_llm_behavior/CHAPTER.md
          test -f chapters/45_alternative_prediction/CHAPTER.md

      - name: Overlay Chapters 46-98 and Appendices A-L
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          tar -xJf payloads/complete_book_v3/remaining.tar.xz -C "$work"
          source_dir=$(find "$work" -type f -name COMPLETE_BOOK_MANIFEST.md -printf '%h\n' | head -n 1)
          test -n "$source_dir"
          rsync -a --exclude='__pycache__/' --exclude='*.pyc' "$source_dir"/ ./
          rm -rf "$work"
          test -f chapters/46_sft/CHAPTER.md
          test -f chapters/98_frontier_observatory/CHAPTER.md
          test -f appendices/L_edizioni_alias/APPENDIX.md

      - name: Generate all remaining technical visuals
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_remaining_visuals.py

      - name: Freeze final chapter and appendix artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_complete_book.py

      - name: Validate all chapters, appendices, tests and images
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_complete_book.py
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys
          from PIL import Image

          root = Path('.')
          chapters = []
          total_tests = 0
          for number in range(1, 99):
              matches = sorted((root / 'chapters').glob(f'{number:02d}_*'))
              assert len(matches) == 1, (number, matches)
              chapter = matches[0]
              chapters.append(chapter)
              for name in ('CHAPTER.md', 'PLAN.md', 'FONTI_PRIMARIE.md', 'CLAIMS.md', 'TEXT_AUDIT.md', 'REVIEW.md', 'CHANGELOG.md'):
                  assert (chapter / name).is_file(), (chapter, name)
              text = (chapter / 'CHAPTER.md').read_text(encoding='utf-8')
              assert '—' not in text, chapter
              assert 'candidate-v' not in text, chapter
              tests = sorted((chapter / 'code').glob('test_*.py'))
              assert tests, chapter
              for test_file in tests:
                  run = subprocess.run(
                      [sys.executable, '-m', 'unittest', '-v', test_file.name],
                      cwd=test_file.parent,
                      capture_output=True,
                      text=True,
                  )
                  if run.returncode:
                      raise RuntimeError(f'{test_file}\n{run.stdout}\n{run.stderr}')
                  total_tests += len(re.findall(r'^\s*def test_', test_file.read_text(encoding='utf-8'), re.MULTILINE))
              asset_dirs = sorted((root / 'assets' / 'chapters').glob(f'{number:02d}_*'))
              assert len(asset_dirs) == 1, (number, asset_dirs)
              finals = sorted(asset_dirs[0].glob('*/final.png'))
              assert len(finals) >= 2, (number, finals)
              for path in finals:
                  with Image.open(path) as image:
                      image.verify()
                  with Image.open(path) as image:
                      rgb = image.convert('RGB')
                      assert rgb.getpixel((0, 0)) == (255, 255, 255), path
                      assert rgb.getpixel((rgb.width - 1, rgb.height - 1)) == (255, 255, 255), path

          appendix_dirs = sorted(path for path in (root / 'appendices').iterdir() if path.is_dir())
          assert len(appendix_dirs) == 12, appendix_dirs
          for appendix in appendix_dirs:
              for name in ('APPENDIX.md', 'SOURCES.md', 'REVIEW.md'):
                  assert (appendix / name).is_file(), (appendix, name)
              text = (appendix / 'APPENDIX.md').read_text(encoding='utf-8')
              assert '—' not in text, appendix
              assert 'candidate-v' not in text, appendix
              visual_root = root / 'assets' / 'appendices' / appendix.name
              finals = sorted(visual_root.glob('*/final.png'))
              assert finals, appendix
              for path in finals:
                  with Image.open(path) as image:
                      image.verify()

          assert len(chapters) == 98
          assert (root / 'COMPLETE_BOOK_MANIFEST.md').is_file()
          assert (root / 'COMPLETE_BOOK_VALIDATION.txt').is_file()
          print(f'FINAL VALIDATION: chapters=98 appendices=12 tests={total_tests}')
          PY

      - name: Clean staging and obsolete production helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf payloads
          rm -rf tmp
          rm -f .github/workflows/materialize-milestone-14-30.yml
          rm -f .github/workflows/generate-milestone-31-45.yml
          rm -f .github/workflows/finalize-milestone-45.yml
          rm -f .github/workflows/materialize-complete-book-v2.yml
          rm -f .github/workflows/generate-book-visuals.yml
          rm -f scripts/specs_14_45.py
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Update pull request to final review state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF'
          ## Opera completa

          Il feature branch contiene ora l'intera opera **Intelligenza artificiale generativa**:

          - 98 capitoli, Parti P01-P14;
          - 12 appendici, A-L;
          - prosa italiana, fonti, claim, codice, test e output;
          - immagini tecniche finali con sfondo bianco;
          - audit del testo, del codice, delle visuali e della continuità;
          - validazione integrale eseguita nel workflow.

          Tutti i riferimenti alle figure puntano a `final.png`. I payload e i workflow temporanei di materializzazione sono stati rimossi. La pull request è pronta per il merge definitivo in `main`.
          EOF
          gh pr edit 2 \
            --repo ferdinandobons/aibook \
            --title 'Complete book: 98 chapters and 12 appendices' \
            --body-file /tmp/pr-body.md

      - name: Commit complete book to production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Complete book already materialized.'
            exit 0
          fi
          git commit -m 'Complete and validate the full AI book'
          git push origin HEAD:feature/full-book-production
