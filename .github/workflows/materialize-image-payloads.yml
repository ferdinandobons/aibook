name: Materialize image payloads

on:
  push:
    branches:
      - feature/full-book-production
    paths:
      - 'image_payloads/*.tar.gz.b64'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and extract image payloads
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          payloads=(image_payloads/*.tar.gz.b64)
          if [ ${#payloads[@]} -eq 0 ]; then
            echo 'No image payloads found.'
            exit 0
          fi
          for payload in "${payloads[@]}"; do
            archive="${payload%.b64}"
            base64 --decode "$payload" > "/tmp/$(basename "$archive")"
            tar -xzf "/tmp/$(basename "$archive")" -C .
            rm -f "$payload"
          done

      - name: Commit materialized PNG files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets image_payloads
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
            exit 0
          fi
          git commit -m 'Materialize reviewed technical image candidates'
          git push origin HEAD:feature/full-book-production
