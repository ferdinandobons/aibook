name: Generate reviewed book visuals

on:
  push:
    branches:
      - feature/full-book-production
    paths:
      - 'scripts/generate_book_visuals.py'
      - '.github/workflows/generate-book-visuals.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate and validate PNG files
        run: python scripts/generate_book_visuals.py

      - name: Commit generated candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/chapters/01_ai_field/AI-01/candidate-v1.png \
            assets/chapters/01_ai_field/AI-02/candidate-v1.png \
            assets/chapters/28_attention/ATT-01/candidate-v3.png
          if git diff --cached --quiet; then
            echo 'Generated PNG files are already current.'
            exit 0
          fi
          git commit -m 'Generate reviewed technical image candidates'
          git push origin HEAD:feature/full-book-production
