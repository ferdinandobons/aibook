name: Diagnose final-book payload reconstruction

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-final-book-payload.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Diagnose payloads
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import lzma
          import tarfile
          from pathlib import Path

          root = Path('payloads/final_book_20260801')
          output = ['# Payload diagnostic', '']

          def compact(path: Path) -> bytes:
              return b''.join(path.read_bytes().split())

          def attempts(parts: list[Path]):
              methods = []
              joined = b''.join(compact(path) for path in parts)
              methods.append(('joined-base64', lambda: base64.b64decode(joined, validate=True)))
              methods.append(('per-part-base64', lambda: b''.join(base64.b64decode(compact(path), validate=True) for path in parts)))
              reverse = list(reversed(parts))
              joined_reverse = b''.join(compact(path) for path in reverse)
              methods.append(('reverse-joined-base64', lambda: base64.b64decode(joined_reverse, validate=True)))
              methods.append(('reverse-per-part-base64', lambda: b''.join(base64.b64decode(compact(path), validate=True) for path in reverse)))
              for name, operation in methods:
                  try:
                      yield name, operation(), None
                  except Exception as exc:
                      yield name, b'', repr(exc)

          gen_parts = sorted((root / 'gen14').glob('part_*.b64'))
          rem_parts = sorted((root / 'remaining').glob('part_*.b64'))
          output += ['## Files', '', '### gen14']
          for path in gen_parts:
              output.append(f'- `{path.name}`: {path.stat().st_size} bytes')
          output += ['', '### remaining']
          for path in rem_parts:
              output.append(f'- `{path.name}`: {path.stat().st_size} bytes')

          output += ['', '## gen14 attempts', '']
          gen_ok = False
          for mode, data, error in attempts(gen_parts):
              if error:
                  output.append(f'- `{mode}`: decode error `{error}`')
                  continue
              digest = hashlib.sha256(data).hexdigest()
              try:
                  decoded = lzma.decompress(data)
                  result = f'xz ok, decoded={len(decoded)}, sha256={digest}, prefix={decoded[:32]!r}'
                  gen_ok = True
              except Exception as exc:
                  result = f'xz error {exc!r}, bytes={len(data)}, sha256={digest}, prefix={data[:16].hex()}'
                  if b'from __future__' in data and b'ChapterSpec' in data:
                      result += ', raw python candidate'
                      gen_ok = True
              output.append(f'- `{mode}`: {result}')

          output += ['', '## remaining attempts', '']
          rem_ok = False
          for mode, data, error in attempts(rem_parts):
              if error:
                  output.append(f'- `{mode}`: decode error `{error}`')
                  continue
              digest = hashlib.sha256(data).hexdigest()
              candidate = Path('/tmp/remaining-candidate.tar.xz')
              candidate.write_bytes(data)
              try:
                  with tarfile.open(candidate, mode='r:xz') as archive:
                      names = archive.getnames()
                  manifest = [name for name in names if name.endswith('COMPLETE_BOOK_MANIFEST.md')]
                  result = f'tar.xz ok, entries={len(names)}, manifests={manifest}, sha256={digest}'
                  rem_ok = True
              except Exception as exc:
                  result = f'tar.xz error {exc!r}, bytes={len(data)}, sha256={digest}, prefix={data[:16].hex()}'
              output.append(f'- `{mode}`: {result}')

          output += ['', '## Verdict', '', f'- gen14 reconstructable: `{gen_ok}`', f'- remaining reconstructable: `{rem_ok}`', '']
          Path('PAYLOAD_DIAGNOSTIC.md').write_text('\n'.join(output), encoding='utf-8')
          PY

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PAYLOAD_DIAGNOSTIC.md
          git commit -m 'Record final-book payload diagnostics'
          git push origin HEAD:main
