name: Finalize production milestone through chapter 45

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - feature/full-book-production
    paths:
      - '.github/workflows/finalize-milestone-45.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-book-production
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate chapters 1-45
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          root = Path('.')
          chapters = []
          for number in range(1, 46):
              matches = sorted((root / 'chapters').glob(f'{number:02d}_*'))
              assert len(matches) == 1, (number, matches)
              chapter = matches[0]
              chapters.append(chapter)
              for name in ('CHAPTER.md', 'PLAN.md', 'FONTI_PRIMARIE.md', 'CLAIMS.md', 'TEXT_AUDIT.md', 'REVIEW.md', 'CHANGELOG.md'):
                  assert (chapter / name).is_file(), (chapter, name)
              text = (chapter / 'CHAPTER.md').read_text(encoding='utf-8')
              assert '—' not in text, chapter
              tests = sorted((chapter / 'code').glob('test_*.py'))
              assert tests, chapter
              for test_file in tests:
                  run = subprocess.run(
                      [sys.executable, '-m', 'unittest', '-v', test_file.name],
                      cwd=test_file.parent,
                      capture_output=True,
                      text=True,
                  )
                  if run.returncode:
                      raise RuntimeError(f'{test_file}\n{run.stdout}\n{run.stderr}')

          for number in range(1, 46):
              asset_dirs = sorted((root / 'assets' / 'chapters').glob(f'{number:02d}_*'))
              assert len(asset_dirs) == 1, (number, asset_dirs)
              candidates = sorted(asset_dirs[0].glob('*/candidate-v*.png'))
              finals = sorted(asset_dirs[0].glob('*/final.png'))
              assert candidates or finals, asset_dirs[0]

          assert (root / 'docs' / '06_CONTINUITA_TRA_CAPITOLI.md').is_file()
          assert (root / 'docs' / '06_CONTINUITA_TRA_CAPITOLI_31_45.md').is_file()
          print(f'validated {len(chapters)} chapters through chapter 45')
          PY

      - name: Consolidate milestone documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          progress = '''# Avanzamento del libro

## Stato corrente

- Repository: `ferdinandobons/aibook`
- Branch canonico: `main`
- Branch di produzione: `feature/full-book-production`
- Pull request: `#2`, draft
- Opera pianificata: 98 capitoli e 12 appendici
- Ultima ricerca approfondita globale: 30 luglio 2026
- Ultima verifica delle candidature correnti: 31 luglio 2026
- Unità successiva: `CH-P09-SFT`, Capitolo 46

## Milestone raggiunta

I Capitoli 1-45 sono presenti nel feature branch come candidature complete o come pilota già approvato. Ogni capitolo dispone di testo, fonti, claim, codice, test, output, visuali tecniche e audit. Le figure restano candidate fino alla revisione autoriale e al congelamento.

| Intervallo | Parte | Stato |
|---:|---|---|
| 1-4 | `P01` Campo, metodo e storia | candidature complete |
| 5-9 | `P02` Matematica, informazione e calcolo | candidature complete |
| 10-14 | `P03` Apprendimento, ottimizzazione e decisione | candidature complete |
| 15-19 | `P04` Reti neurali e rappresentazioni | candidature complete |
| 20-25 | `P05` Modellazione generativa | candidature complete |
| 26-31 | `P06` Sequenze, linguaggio e contesto | candidature complete; Capitolo 28 pilota approvato |
| 32-36 | `P07` Dati, pretraining e scaling | candidature complete |
| 37-45 | `P08` Progettazione delle architetture | candidature complete |
| 46-54 | `P09` Adattamento, allineamento e ragionamento | prossimo blocco |
| 55-98 | `P10-P14` | pianificati |

## Gate applicati

Ogni candidatura attraversa fonti, claim, piano, prosa, codice, test, visuali, audit tecnico, review didattica, gate anti-template, review editoriale e linguistica, controllo per lettore non esperto e audit di continuità.

Il congelamento, la rinomina delle immagini in `final.png` e il merge definitivo richiedono revisione autoriale.

## Continuità

La matrice canonica in `docs/06_CONTINUITA_TRA_CAPITOLI.md` copre ora il percorso fino al Capitolo 45. I passaggi principali sono:

```text
fondamenti
-> matematica e informazione
-> apprendimento e decisione
-> reti e rappresentazioni
-> modellazione generativa
-> testo, embedding, attention e Transformer
-> dati, scaling e pretraining
-> blocchi moderni, contesto, KV, kernel, SSM, memoria, MoE e obiettivi alternativi
```

Non vengono prodotti render completi delle pagine. Gli artefatti sono Markdown, formule, immagini tecniche, codice, test, output, fonti e audit.
'''

          production = '''# Piano operativo per la produzione completa del libro

## Stato

- Branch di produzione: `feature/full-book-production`
- Branch canonico: `main`
- Pull request: `#2`, draft
- Opera pianificata: 98 capitoli e 12 appendici
- Modalità: produzione seriale controllata
- Milestone corrente: Capitoli 1-45 prodotti
- Unità successiva: `CH-P09-SFT`, Capitolo 46
- Ultimo aggiornamento: 31 luglio 2026

## Sequenza di produzione

```text
ricerca
-> claim
-> piano e contratto di continuità
-> stesura
-> formule e derivazioni
-> codice e test
-> visuali e audit
-> audit fattuale, matematico e algoritmico
-> review didattica
-> gate anti-template
-> review editoriale e linguistica
-> verifica per lettore non esperto
-> audit tra capitoli
-> revisione autoriale
-> congelamento
```

## Quadro dell'opera

| Parte | Intervallo | Stato |
|---|---:|---|
| `P01` | 1-4 | prodotto |
| `P02` | 5-9 | prodotto |
| `P03` | 10-14 | prodotto |
| `P04` | 15-19 | prodotto |
| `P05` | 20-25 | prodotto |
| `P06` | 26-31 | prodotto |
| `P07` | 32-36 | prodotto |
| `P08` | 37-45 | prodotto |
| `P09` | 46-54 | prossimo blocco |
| `P10` | 55-62 | pianificato |
| `P11` | 63-72 | pianificato |
| `P12` | 73-82 | pianificato |
| `P13` | 83-93 | pianificato |
| `P14` | 94-98 | pianificato |

## Regola di prosecuzione

Il Capitolo 46 deve partire dall'output del Capitolo 45. Un modello preaddestrato con architettura e obiettivo definiti deve essere adattato a istruzioni e formati senza confondere supervised fine-tuning, preference optimization e reinforcement learning.

Dopo ogni blocco si aggiornano `PROGRESS.md`, questo file, la matrice di continuità e la descrizione della pull request.
'''

          Path('PROGRESS.md').write_text(progress, encoding='utf-8')
          Path('BOOK_PRODUCTION.md').write_text(production, encoding='utf-8')

          canonical_path = Path('docs/06_CONTINUITA_TRA_CAPITOLI.md')
          extension_path = Path('docs/06_CONTINUITA_TRA_CAPITOLI_31_45.md')
          canonical = canonical_path.read_text(encoding='utf-8').rstrip()
          extension = extension_path.read_text(encoding='utf-8')
          extension_lines = extension.splitlines()
          if extension_lines and extension_lines[0].startswith('# '):
              extension = '\n'.join(extension_lines[1:]).lstrip()
          marker = '## 8. Estensione della matrice. Capitoli 31-45'
          if marker in canonical:
              canonical = canonical.split(marker)[0].rstrip()
          canonical = canonical + '\n\n' + marker + '\n\n' + extension.rstrip() + '\n'
          canonical_path.write_text(canonical, encoding='utf-8')
          extension_path.unlink()
          PY

      - name: Update pull request description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF'
          ## Scopo

          Branch di produzione seriale dell'opera **Intelligenza artificiale generativa**.

          ## Milestone corrente

          I Capitoli **1-45** sono presenti come candidature complete nel feature branch. Il Capitolo 28 conserva lo stato di pilota approvato. Il prossimo blocco parte dal Capitolo 46, `CH-P09-SFT`.

          Le parti completate sono:

          - `P01`, campo, metodo e storia;
          - `P02`, matematica, informazione e calcolo;
          - `P03`, apprendimento, ottimizzazione e decisione;
          - `P04`, reti neurali e rappresentazioni;
          - `P05`, modellazione generativa;
          - `P06`, sequenze, linguaggio e contesto;
          - `P07`, dati, pretraining e scaling;
          - `P08`, progettazione delle architetture.

          ## Artefatti

          Ogni capitolo contiene prosa italiana, fonti e claim, codice eseguito, test, output, due visuali tecniche candidate e audit. La continuità è verificata fino al Capitolo 45.

          Le figure restano `candidate-v*.png` fino alla revisione autoriale. Non vengono prodotti mockup o render completi delle pagine.

          ## Prossimo blocco

          ```text
          46 Supervised fine-tuning e instruction tuning
          -> 47 Fine-tuning efficiente
          -> 48 Preferenze, reward model e RLHF
          -> prosecuzione della Parte P09
          ```

          La pull request resta draft durante la produzione.
          EOF
          gh pr edit 2 \
            --repo ferdinandobons/aibook \
            --title 'Production: Capitoli 1-45 prodotti, Parte P09 pronta' \
            --body-file /tmp/pr-body.md

      - name: Commit documentation milestone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROGRESS.md BOOK_PRODUCTION.md docs/06_CONTINUITA_TRA_CAPITOLI.md
          git add -u docs/06_CONTINUITA_TRA_CAPITOLI_31_45.md
          if git diff --cached --quiet; then
            echo 'Milestone documentation already current.'
            exit 0
          fi
          git commit -m 'Record completed production through chapter 45'
          git push origin HEAD:feature/full-book-production
