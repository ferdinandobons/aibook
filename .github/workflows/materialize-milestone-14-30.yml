name: Materialize milestone 14-30

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'feature/full-book-production' }}
          fetch-depth: 0

      - name: Verify staged payload
        shell: bash
        run: |
          set -euo pipefail
          test -d payloads/milestone_14_30
          count=$(find payloads/milestone_14_30 -maxdepth 1 -name 'part_*.b64' | wc -l)
          test "$count" -ge 1
          echo "Payload parts: $count"

      - name: Reconstruct and unpack package
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cat $(find payloads/milestone_14_30 -maxdepth 1 -name 'part_*.b64' | sort) > "$work/package.b64"
          base64 --decode "$work/package.b64" > "$work/package.zip"
          unzip -q "$work/package.zip" -d "$work/unpacked"
          source_dir=$(find "$work/unpacked" -type f -name MANIFEST.md -printf '%h\n' | head -n 1)
          test -n "$source_dir"
          rsync -a "$source_dir"/ ./
          rm -rf payloads/milestone_14_30
          rm -rf "$work"

      - name: Validate generated milestone
        shell: bash
        run: |
          set -euo pipefail
          test -f chapters/14_reinforcement_learning/CHAPTER.md
          test -f chapters/30_pretraining_families/CHAPTER.md
          test -f scripts/generate_chapters_14_30.py
          python scripts/generate_chapters_14_30.py --check

      - name: Commit materialized milestone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Milestone already materialized.'
            exit 0
          fi
          git commit -m 'Materialize reviewed chapters 14-30'
          git push origin HEAD:feature/full-book-production
