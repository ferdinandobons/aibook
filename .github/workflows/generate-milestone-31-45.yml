name: Generate milestone chapters 31-45

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - feature/full-book-production
    paths:
      - 'scripts/generate_milestone_31_45.py'
      - '.github/workflows/generate-milestone-31-45.yml'

permissions:
  contents: write

concurrency:
  group: generate-chapters-31-45
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-book-production
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch

      - name: Generate chapters, code, tests and visual candidates
        run: python scripts/generate_milestone_31_45.py

      - name: Validate milestone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          from PIL import Image

          chapters = []
          for number in range(31, 46):
              matches = sorted(Path('chapters').glob(f'{number:02d}_*'))
              assert len(matches) == 1, (number, matches)
              chapter = matches[0]
              chapters.append(chapter)
              for name in ('CHAPTER.md', 'PLAN.md', 'FONTI_PRIMARIE.md', 'CLAIMS.md', 'TEXT_AUDIT.md', 'REVIEW.md', 'CHANGELOG.md'):
                  assert (chapter / name).is_file(), (chapter, name)
              for test_file in sorted((chapter / 'code').glob('test_*.py')):
                  run = subprocess.run([sys.executable, '-m', 'unittest', '-v', test_file.name], cwd=test_file.parent, capture_output=True, text=True)
                  if run.returncode:
                      raise RuntimeError(f'{test_file}\n{run.stdout}\n{run.stderr}')

          pngs = []
          for number in range(31, 46):
              roots = sorted(Path('assets/chapters').glob(f'{number:02d}_*'))
              assert len(roots) == 1, (number, roots)
              current = sorted(roots[0].glob('*/candidate-v1.png'))
              assert len(current) == 2, (number, current)
              pngs.extend(current)

          for path in pngs:
              with Image.open(path) as image:
                  assert image.size == (1800, 1000), (path, image.size)
                  rgb = image.convert('RGB')
                  assert rgb.getpixel((0, 0)) == (255, 255, 255), path
                  assert rgb.getpixel((1799, 999)) == (255, 255, 255), path

          assert len(chapters) == 15
          assert len(pngs) == 30
          assert Path('docs/06_CONTINUITA_TRA_CAPITOLI_31_45.md').is_file()
          print(f'validated chapters={len(chapters)} pngs={len(pngs)}')
          PY

      - name: Commit milestone to production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapters assets/chapters docs/06_CONTINUITA_TRA_CAPITOLI_31_45.md MILESTONE_31_45.md
          if git diff --cached --quiet; then
            echo 'Milestone 31-45 already current.'
            exit 0
          fi
          git commit -m 'Generate reviewed chapters 31-45'
          git push origin HEAD:feature/full-book-production
