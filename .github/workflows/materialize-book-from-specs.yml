name: Materialize complete book from verified specifications

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'payloads/materializer_specs_v1/READY'
      - '.github/workflows/materialize-book-from-specs.yml'

permissions:
  contents: write

concurrency:
  group: materialize-book-from-specs
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch

      - name: Reconstruct the materializer
        shell: bash
        run: |
          set -euo pipefail
          parts=( $(find payloads/materializer_specs_v1 -maxdepth 1 -name 'part_*.b64' | sort) )
          test "${#parts[@]}" -eq 3
          : > /tmp/materialize_book_from_specs.py.xz
          for part in "${parts[@]}"; do
            base64 --decode "$part" >> /tmp/materialize_book_from_specs.py.xz
          done
          echo '31523775a2391ab17e209215f879e450a2231c2978374b079e1bee2ee8100ecf  /tmp/materialize_book_from_specs.py.xz' | sha256sum -c -
          xz -t /tmp/materialize_book_from_specs.py.xz
          xz -dc /tmp/materialize_book_from_specs.py.xz > scripts/materialize_book_from_specs.py
          python -m py_compile scripts/materialize_book_from_specs.py

      - name: Generate chapters, appendices, code, tests and visuals
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_book_from_specs.py | tee /tmp/materialization-output.txt

      - name: Verify the final repository state
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^status=passed$' COMPLETE_BOOK_VALIDATION.txt
          test "$(find chapters -mindepth 2 -maxdepth 2 -name CHAPTER.md | wc -l)" -eq 98
          test "$(find appendices -mindepth 2 -maxdepth 2 -name APPENDIX.md | wc -l)" -eq 12
          test -f chapters/14_reinforcement_learning/CHAPTER.md
          test -f chapters/29_transformer/CHAPTER.md
          test -f chapters/31_llm_behavior/CHAPTER.md
          test -f chapters/46_sft/CHAPTER.md
          test -f chapters/98_frontier_observatory/CHAPTER.md
          test -f appendices/A_python_numpy_pytorch/APPENDIX.md
          test -f appendices/L_edizioni_alias/APPENDIX.md
          test -f assets/chapters/98_frontier_observatory/CH98-01/final.png
          test -f assets/appendices/L_edizioni_alias/APP-L-01/final.png

      - name: Clean transient production material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf payloads
          rm -f PAYLOAD_DIAGNOSTIC.md
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f .github/workflows/materialize-milestone-14-30.yml
          rm -f .github/workflows/generate-milestone-31-45.yml
          rm -f .github/workflows/finalize-milestone-45.yml
          rm -f .github/workflows/generate-book-visuals.yml
          rm -f .github/workflows/materialize-complete-book-v2.yml
          rm -f .github/workflows/materialize-complete-book-v3.yml
          rm -f .github/workflows/materialize-final-book-direct.yml
          rm -f .github/workflows/diagnose-final-book-payload.yml
          rm -f .github/workflows/materialize-book-from-specs.yml

      - name: Commit the complete book directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'The complete book is already materialized.'
            exit 0
          fi
          git commit -m 'Materialize and validate all 98 chapters and 12 appendices'
          git push origin HEAD:main
