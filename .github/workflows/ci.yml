name: Minimal book checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install local audit dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'pillow==12.1.1' 'ruff==0.15.2'

      - name: Check book structure and image references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          chapters = sorted(root.joinpath('chapters').glob('[0-9][0-9]_*/CHAPTER.md'))
          appendices = sorted(root.joinpath('appendices').glob('*/APPENDIX.md'))
          assert len(chapters) == 98, f'expected 98 chapters, found {len(chapters)}'
          assert len(appendices) == 12, f'expected 12 appendices, found {len(appendices)}'

          documents = chapters + appendices
          references = []
          references_by_document = []
          for document in documents:
              text = document.read_text(encoding='utf-8')
              assert text.strip(), document
              assert '—' not in text, document
              assert not re.search(r'<!--\s*(?:inserire|todo|fixme|tbd)\b', text, re.IGNORECASE), document
              document_references = []
              for relative in re.findall(r'!\[[^]]*\]\(([^)]+\.png)\)', text):
                  target = (document.parent / relative).resolve()
                  assert target.is_file(), f'{document}: missing {relative}'
                  references.append(target)
                  document_references.append(target)
              references_by_document.append(document_references)

          assert all(
              references_by_document,
          ), 'each chapter or appendix needs at least one active visual'
          assert len(set(references)) == len(references), 'duplicate active image reference'

          for final_path in root.joinpath('assets').rglob('final.png'):
              metadata = '\n'.join(
                  candidate.read_text(encoding='utf-8')
                  for candidate in sorted(final_path.parent.glob('*.md'))
              )
              assert re.search(
                  r'approvazione autoriale:\s*approvata',
                  metadata,
                  re.IGNORECASE,
              ), f'{final_path}: final asset lacks author approval'

          print(f'OK: {len(chapters)} chapters, {len(appendices)} appendices, {len(references)} images')
          PY

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          files = sorted(Path('.').rglob('*.py'))
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'OK: parsed {len(files)} Python files')

      - name: Check generated Python style
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            scripts/audit_book_general.py \
            scripts/audit_code_alignment.py \
            scripts/audit_editorial_quality.py \
            scripts/audit_editorial_variation.py \
            scripts/audit_formula_contracts.py \
            scripts/audit_generator_idempotence.py \
            scripts/audit_semantic_alignment.py \
            scripts/audit_visual_geometry.py \
            scripts/generate_visuals_v2.py \
            scripts/rebuild_lessons_v2.py \
            scripts/revise_book_completeness.py \
            scripts/verify_source_claims.py \
            scripts/visual_geometry.py \
            chapters/[0-9][0-9]_*/code

      - name: Check lesson-specific quality contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python scripts/audit_book_quality.py --strict

      - name: Check semantic alignment and sources
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python scripts/audit_semantic_alignment.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/audit_book_general.py --strict

      - name: Check visual geometry and editorial variation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python scripts/audit_visual_geometry.py --strict
          PYTHONDONTWRITEBYTECODE=1 python scripts/audit_code_alignment.py --strict
          PYTHONDONTWRITEBYTECODE=1 python scripts/audit_generator_idempotence.py --strict
          PYTHONDONTWRITEBYTECODE=1 python scripts/audit_editorial_variation.py --strict
          PYTHONDONTWRITEBYTECODE=1 python scripts/audit_editorial_quality.py --strict
          PYTHONDONTWRITEBYTECODE=1 python scripts/audit_formula_contracts.py --strict

      - name: Execute chapter and NumPy/PyTorch examples
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python scripts/run_all_examples.py --include-appendix-a

      - name: Install JAX CPU environment
        run: python -m pip install --disable-pip-version-check --no-input 'jax[cpu]==0.11.0'

      - name: Execute JAX appendix example
        shell: bash
        run: |
          set -euo pipefail
          cd appendices/B_jax
          PYTHONDONTWRITEBYTECODE=1 python -m unittest -v test_example_jax.py
